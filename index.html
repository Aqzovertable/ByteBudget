<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ByteBudget — EXADY</title><style>
:root{--bg:#0d140f;--p:#17221a;--line:#2b4031;--txt:#edf7ef;--muted:#9caf9f;--lime:#c9f27a;--green:#9be0aa;--red:#ff9696}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0%,#20442b,transparent 35%),var(--bg);color:var(--txt);font:15px/1.5 system-ui,Arial}.wrap{max-width:1050px;margin:auto;padding:30px 20px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:35px}.brand{font-size:21px;font-weight:800}.tag,.muted{color:var(--muted);font-size:13px}h1{font-size:clamp(29px,5vw,43px);letter-spacing:-1.5px;margin:0 0 5px}.intro p{color:var(--muted);margin:0}.summary{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:13px;margin:25px 0}.card,.panel{background:var(--p);border:1px solid var(--line);border-radius:16px;padding:18px}.card small{color:var(--muted)}.amount{font-size:27px;font-weight:800;margin-top:5px}.balance{background:linear-gradient(135deg,#c9f27a,#75ce8b);color:#132018;border:0}.balance small{color:#304a34}.balance .amount{font-size:34px}.green{color:var(--green)}.red{color:var(--red)}.layout{display:grid;grid-template-columns:.9fr 1.1fr;gap:14px}.panel h2{font-size:17px;margin:0 0 16px}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:12px;color:var(--muted)}input,select{width:100%;background:#0f1912;color:var(--txt);border:1px solid #344a39;border-radius:9px;padding:11px;font:inherit}.submit{width:100%;padding:12px;border:0;border-radius:10px;background:var(--lime);font-weight:800;cursor:pointer}.filters{display:flex;gap:8px;margin-bottom:10px}.filters input{flex:1;min-width:0}.filters select{width:120px}.tx{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #2b3a30}.tx:last-child{border:0}.txname{font-weight:650}.txmeta{font-size:12px;color:var(--muted)}.txright{display:flex;gap:10px;align-items:center;font-weight:750}.del{background:#304035;color:white;border:0;border-radius:7px;padding:5px 8px;cursor:pointer}.empty{text-align:center;padding:25px;color:#819486}.chart{margin-top:18px}.barrow{display:grid;grid-template-columns:75px 1fr 70px;gap:9px;align-items:center;margin:10px 0;font-size:12px;color:var(--muted)}.track{height:8px;background:#304035;border-radius:10px;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,#83d78e,#d0f27a)}.foot{text-align:center;color:#718477;font-size:12px;margin-top:20px}@media(max-width:720px){.summary{grid-template-columns:1fr 1fr}.balance{grid-column:1/-1}.layout{grid-template-columns:1fr}.wrap{padding:22px 13px}}
</style></head><body><main class="wrap"><header class="top"><div class="brand">◈ ByteBudget</div><div class="tag">EXADY · DEMO PROJECT</div></header><section class="intro"><h1>Деньги под контролем.</h1><p>Простой трекер доходов и расходов без лишней сложности.</p></section><section class="summary"><div class="card balance"><small>Текущий баланс</small><div class="amount" id="balance">0 ₽</div></div><div class="card"><small>Доходы</small><div class="amount green" id="income">0 ₽</div></div><div class="card"><small>Расходы</small><div class="amount red" id="expense">0 ₽</div></div></section><div class="layout"><section class="panel"><h2>＋ Добавить операцию</h2><form id="form"><div class="field"><label>Название</label><input id="name" required maxlength="55" placeholder="Например, продукты"></div><div class="field"><label>Сумма (₽)</label><input id="amount" type="number" min="1" step=".01" required placeholder="1200"></div><div class="field"><label>Тип операции</label><select id="type"><option value="expense">Расход</option><option value="income">Доход</option></select></div><div class="field"><label>Категория</label><select id="category"><option>Еда</option><option>Транспорт</option><option>Покупки</option><option>Подписки</option><option>Зарплата</option><option>Другое</option></select></div><button class="submit">Сохранить операцию</button></form></section><section class="panel"><h2>История операций</h2><div class="filters"><input id="search" placeholder="Поиск…"><select id="kind"><option value="all">Все</option><option value="income">Доходы</option><option value="expense">Расходы</option></select></div><div id="list"></div><div class="chart"><h2>Расходы по категориям</h2><div id="bars"></div></div></section></div><div class="foot">Локальное сохранение · ByteBudget by EXADY</div></main>
<script>
const $=s=>document.querySelector(s),KEY='exady-bytebudget';let rows=JSON.parse(localStorage.getItem(KEY)||'null')||[{id:1,name:'Зарплата',amount:65000,type:'income',category:'Зарплата',date:new Date().toISOString()},{id:2,name:'Продукты',amount:4200,type:'expense',category:'Еда',date:new Date().toISOString()},{id:3,name:'Проездной',amount:1800,type:'expense',category:'Транспорт',date:new Date().toISOString()},{id:4,name:'Подписка',amount:599,type:'expense',category:'Подписки',date:new Date().toISOString()}];const money=n=>new Intl.NumberFormat('ru-RU',{style:'currency',currency:'RUB',maximumFractionDigits:0}).format(n),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){let inc=rows.filter(x=>x.type==='income').reduce((a,x)=>a+x.amount,0),out=rows.filter(x=>x.type==='expense').reduce((a,x)=>a+x.amount,0);$('#balance').textContent=money(inc-out);$('#income').textContent=money(inc);$('#expense').textContent=money(out);let q=$('#search').value.toLowerCase(),k=$('#kind').value,shown=rows.filter(x=>(k==='all'||x.type===k)&&(x.name+' '+x.category).toLowerCase().includes(q)).sort((a,b)=>b.id-a.id);$('#list').innerHTML=shown.length?shown.map(x=>`<div class="tx"><div><div class="txname">${esc(x.name)}</div><div class="txmeta">${esc(x.category)} · ${new Date(x.date).toLocaleDateString('ru-RU')}</div></div><div class="txright"><span class="${x.type==='income'?'green':'red'}">${x.type==='income'?'+':'−'}${money(x.amount)}</span><button class="del" data-del="${x.id}">×</button></div></div>`).join(''):'<div class="empty">Операций пока нет</div>';let cats={};rows.filter(x=>x.type==='expense').forEach(x=>cats[x.category]=(cats[x.category]||0)+x.amount);let vals=Object.entries(cats).sort((a,b)=>b[1]-a[1]),max=Math.max(1,...vals.map(x=>x[1]));$('#bars').innerHTML=vals.length?vals.map(([n,v])=>`<div class="barrow"><span>${esc(n)}</span><div class="track"><div class="bar" style="width:${v/max*100}%"></div></div><span style="text-align:right">${money(v)}</span></div>`).join(''):'<div class="muted">Добавьте расходы для статистики</div>'}
$('#form').onsubmit=e=>{e.preventDefault();rows.push({id:Date.now(),name:$('#name').value.trim(),amount:Number($('#amount').value),type:$('#type').value,category:$('#category').value,date:new Date().toISOString()});localStorage.setItem(KEY,JSON.stringify(rows));e.target.reset();render()};$('#search').oninput=render;$('#kind').onchange=render;document.addEventListener('click',e=>{let b=e.target.closest('[data-del]');if(!b)return;rows=rows.filter(x=>x.id!==Number(b.dataset.del));localStorage.setItem(KEY,JSON.stringify(rows));render()});render();
</script></body></html>
